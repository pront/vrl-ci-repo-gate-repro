name: Test Suite
'on':
  pull_request: null
  merge_group:
    types:
    - checks_requested
  push:
    branches:
    - main
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true
env:
  RUST_BACKTRACE: full
  TEST_LOG: vector=debug
  VERBOSE: true
  CI: true
  PROFILE: debug
jobs:
  repo-gate:
    uses: ./.github/workflows/ci-repo-gate.yml
  clippy:
    needs: repo-gate
    runs-on: ubuntu-latest
    steps:
    - name: Controlled required-check failure
      env:
        FAIL_CLIPPY: ${{ vars.REPRO_CLIPPY_FAIL }}
      run: "printf \"clippy_failure=%s\\n\" \"$FAIL_CLIPPY\"\nif [ \"$FAIL_CLIPPY\" = \"true\" ]; then\n  exit 1\n\
        fi\ntrue\n"
  fmt:
    needs: repo-gate
    runs-on: ubuntu-latest
    steps:
    - name: Successful scheduler control
      run: 'true'
  test:
    needs: repo-gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
    steps:
    - name: Successful scheduler control
      run: 'true'
  vrl:
    needs: repo-gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
    steps:
    - name: Successful scheduler control
      run: 'true'
  check-licenses:
    needs: repo-gate
    runs-on: ubuntu-latest
    steps:
    - name: Successful scheduler control
      run: 'true'
  check-msrv:
    needs: repo-gate
    runs-on: ubuntu-latest
    steps:
    - name: Successful scheduler control
      run: 'true'
  check-deny:
    needs: repo-gate
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
    steps:
    - name: Successful scheduler control
      run: 'true'
  check-docs:
    needs: repo-gate
    runs-on: ubuntu-latest
    steps:
    - name: Successful scheduler control
      run: 'true'
  check-lockfile:
    needs: repo-gate
    runs-on: ubuntu-latest
    steps:
    - name: Successful scheduler control
      run: 'true'
  wasm32-unknown-unknown:
    needs: repo-gate
    runs-on: ubuntu-latest
    steps:
    - name: Successful scheduler control
      run: 'true'
