name: Check Generated Docs Freshness
'on':
  pull_request: null
  merge_group:
    types:
    - checks_requested
  push:
    branches:
    - main
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true
env:
  COMMIT_MESSAGE: Update generated docs
  COMMIT_AUTHOR: github-actions[bot]
permissions:
  contents: read
jobs:
  repo-gate:
    uses: ./.github/workflows/ci-repo-gate.yml
    with:
      upstream-only: true
  changes:
    needs: repo-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
    - id: filter
      run: echo "docs=false" >> "$GITHUB_OUTPUT"
  run-check-generated-docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - name: Successful scheduler control
      run: 'true'
  check-generated-docs:
    if: always() && needs.repo-gate.result != 'skipped'
    runs-on: ubuntu-latest
    needs:
    - repo-gate
    - changes
    - run-check-generated-docs
    steps:
    - run: "if [[ \"${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}\" == \"\
        true\" ]]; then\n  echo \"One or more jobs failed or were cancelled\"\n  exit 1\nfi\n"
