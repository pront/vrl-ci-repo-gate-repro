name: Merge Queue
'on':
  pull_request: null
  merge_group:
    types:
    - checks_requested
permissions:
  contents: read
jobs:
  repo-gate:
    uses: ./.github/workflows/ci-repo-gate.yml
    with:
      upstream-only: true
  check-features:
    needs: repo-gate
    if: ${{ github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    steps:
    - name: Successful scheduler control
      run: 'true'
  check-release:
    needs: repo-gate
    if: ${{ github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Successful scheduler control
      run: 'true'
  merge-queue:
    if: always() && needs.repo-gate.result != 'skipped'
    needs:
    - repo-gate
    - check-features
    - check-release
    runs-on: ubuntu-latest
    steps:
    - name: Check result
      run: "if [[ \"${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}\" == \"\
        true\" ]]; then\n  exit 1\nfi\n"
