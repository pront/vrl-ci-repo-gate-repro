name: Changelog
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - labeled
    - unlabeled
  merge_group:
    types:
    - checks_requested
permissions:
  contents: read
jobs:
  repo-gate:
    uses: ./.github/workflows/ci-repo-gate.yml
    with:
      upstream-only: true
  validate-changelog:
    needs: repo-gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      PR_HAS_LABEL: ${{ contains( github.event.pull_request.labels.*.name, 'no-changelog') }}
    steps:
    - name: Successful scheduler control
      run: 'true'
  check-changelog:
    name: Changelog
    runs-on: ubuntu-latest
    needs:
    - repo-gate
    - validate-changelog
    if: always() && needs.repo-gate.result != 'skipped'
    env:
      FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
    steps:
    - name: exit
      run: "echo \"failed=${{ env.FAILED }}\"\nif [[ \"$FAILED\" == \"true\" ]] ; then\n  exit 1\nelse\n  exit 0\n\
        fi\n"
